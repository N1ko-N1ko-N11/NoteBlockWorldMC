# NoteblockWorldMC configuration.
#
# /nbw reload applies API settings, download limits, playback, and pack settings.
# Pack port/bind-address changes restart its HTTP server and may interrupt an
# active pack transfer; online players receive another push. Pack builds are
# asynchronous, including reloads that pick up audio files supplied by hand.
# /nbw config changes playback settings immediately and writes them here.

# Base URL of the Note Block World API.
# The backend serves its routes under the /v1 prefix.
# Swagger docs (to explore the API yourself) live at <host>/docs
api-base-url: "https://api.noteblock.world/v1"

# HTTP timeouts (seconds)
http:
  connect-timeout: 10
  request-timeout: 15

# Size limits for catalog ZIP downloads and imported NBS files
download:
  max-zip-size-mb: 32
  max-extracted-size-mb: 64
  # Cap on stored songs (0 = unlimited) and simultaneous downloads
  max-stored-songs: 500
  max-concurrent-downloads: 4

# In-game song browser (/nbw)
gui:
  # Play a short click when you press something in the browser. Only sounds
  # for presses that do something -- an empty slot or a decorative pane stays
  # silent. Plays in the MASTER sound category, so it is unaffected by
  # /nbw volume and is never cut by a fade or /nbw stop.
  click-sound: true

# Server resource pack: extended octaves and custom instruments
resource-pack:
  # Try to supply an IMPORTED song's custom instruments from Minecraft itself.
  #
  # A .nbs file names its custom instruments but cannot contain them, so a
  # song imported with /nbw import or /nbw importurl arrives with the names
  # and no audio, and those notes are silent. Songs downloaded from
  # noteblock.world are unaffected -- they ship a zip containing the sounds.
  #
  # With this on, each missing sound is looked up in Mojang's asset index and
  # fetched if it names a real Minecraft sound. That covers most cases,
  # because noteblock.world only accepts Minecraft sounds as custom
  # instruments in the first place. A genuinely custom recording cannot be
  # recovered by any means; those are named in the console so you can drop the
  # .ogg files into the song's sounds/ folder yourself.
  #
  # Off by default because it downloads from Mojang's CDN during an import.
  recover-vanilla-custom-sounds: false

  # Master switch for the extended octave range and custom instruments.
  # Requires public-url below to be set. Changing this takes effect on
  # /nbw reload -- the pack server starts or stops without a restart.
  enabled: false
  # Resource pack format to declare, which must match the Minecraft version
  # your players connect with, or their client marks the pack red and
  # "incompatible" in the resource pack screen.
  #   84 = 26.1 - 26.1.2      88 = 26.2
  # A player can check their own with F3+V. Only bump this when you move the
  # server to a newer Minecraft version -- a mismatch is what makes the pack
  # show up red and "incompatible" in the client's resource pack screen.
  pack-format: 88

  # Port for the built-in pack HTTP server (open it in your firewall).
  # Applied on /nbw reload by restarting the pack HTTP server. Active pack
  # transfers may be interrupted; clients are sent a fresh pack request.
  port: 8194
  # URL your PLAYERS' clients fetch the pack from, e.g.
  # "http://your-server-ip:8194/pack.zip". Must be reachable from outside this
  # machine, with the port above open in your firewall. Blank keeps the pack
  # disabled whatever the switch above says.
  #
  # "auto" fills in this machine's outbound IP and builds the URL from it.
  # Convenient on a public-IP server; behind NAT (most home connections) it
  # finds the LAN address, which outside players cannot reach. Auto never
  # produces https -- set the URL yourself if a reverse proxy terminates TLS.
  # The address in use is printed to the console when the pack server starts.
  #
  # Changing this takes effect on /nbw reload; players online at the time are
  # re-sent the pack from the new address.
  public-url: ""
  # Interface to bind. 0.0.0.0 accepts direct connections. Set 127.0.0.1 to
  # expose it only to a reverse proxy (nginx/Caddy), then point public-url at
  # the proxy's https:// address -- the tidiest setup if you already run one.
  # Applied on /nbw reload, with the same transfer interruption as a port change.
  bind-address: "0.0.0.0"
  # Abuse limits for the pack server. The pack is several megabytes, so a
  # flood could starve real players of their download (and with
  # kick-on-refuse, get them disconnected). 0 disables the rate limit.
  rate-limit-per-minute: 30
  max-concurrent-downloads: 16
  # Require the initial join-time pack and kick if it is refused or fails.
  # Later pushes are optional and failures resolve to fallback playback.
  kick-on-refuse: true
  # Download the vanilla note block sounds from Mojang's asset CDN (once,
  # cached in vanilla-sounds/). Required for extended octaves on vanilla
  # instruments; you may also place the .ogg files there manually.
  download-vanilla-sounds: true
  # Wait this long after a client reports the pack loaded before playing to
  # them. The client signals "loaded" as it APPLIES the pack, while the
  # "Loading resources" screen is still finishing, so notes fired immediately
  # can be missed. Players who loaded the pack earlier are unaffected.
  settle-delay-ms: 2000
  # Coalesce pack rebuilds within this window, so downloading several
  # custom-instrument songs in a row costs players ONE client reload
  rebuild-debounce-seconds: 3
  # Total budget for custom instrument sounds embedded in the pack
  max-custom-sounds-mb: 64
  # Re-push the pack when a custom-sound song is removed, so online players
  # never keep stale sounds.
  #
  # Off by default: a re-push makes EVERY online player re-download the pack
  # and reload their resources, which on a busy server is a large bandwidth
  # spike and an audible interruption -- a steep price for clearing sounds
  # nobody can trigger any more, since the song itself is gone. Left off, the
  # stale sounds simply sit unused until the next natural push (a join, or a
  # download that rebuilds the pack anyway).
  repush-on-remove: false

# Playback display
playback:
  # Show a live progress bar in the action bar while a song plays
  show-actionbar: true
  # Width of that progress bar, in characters (4-40)
  actionbar-length: 20
  # Honour the loop settings stored in the NBS file (loop point, loop count;
  # a count of 0 in the file means loop forever until stopped)
  respect-loop: true
  # Drive playback from a high-resolution thread instead of the 20-per-second
  # game tick. Without this, every note is quantised to a 50ms grid, so songs
  # faster than 20 ticks/second get their notes batched into clumps. Sound
  # packets are emitted off-thread; all world access stays on the main thread.
  high-precision: true
  # Clock interval in milliseconds (2-25). 2ms = 500 steps/second, the finest
  # the plugin allows.
  #
  # The clock runs on its own wall-clock schedule while note times advance
  # with the song, so the two drift against each other continuously. A note
  # therefore waits somewhere between 0 and this many milliseconds to sound --
  # which averages out to half the interval as a small, uniform lateness
  # across the whole song, NOT to notes snapping onto a coarse grid.
  #
  # Two costs scale with this value. The bias above (1ms at 2, 2.5ms at 5,
  # 12.5ms at 25) is inaudible below about 10ms. The bigger one is rhythmic
  # unevenness on FAST songs, since the wait is a share of one song tick:
  #   2ms  -> clean to ~100 t/s (1500 BPM), usable to the 180 t/s maximum
  #   5ms  -> clean to ~40 t/s (600 BPM), wobbly above it
  #
  # Raising this to 5 cuts the clock from 500 to 200 wakeups/second, which is
  # a fair trade on a busy server if none of your songs exceed ~40 t/s (and
  # almost none do -- 10 t/s is Note Block Studio's own default).
  precision-ms: 2
  # Scale dense chords down so the client's mixer doesn't clip on busy
  # passages. Ticks with more than limiter-threshold notes are attenuated by
  # sqrt(threshold/count), preserving perceived loudness without distortion.
  soft-limiter: true

  # How many simultaneous notes count as a chord loud enough to scale back.
  # Below this, notes play at full volume; at or above it the whole chord is
  # attenuated so a dense passage does not clip into a wall of noise. Lower
  # values act sooner and flatten dynamics; higher values leave more headroom.
  # Ignored entirely when soft-limiter is false. Minimum 2.
  limiter-threshold: 8

  # Minimum effective volume sent for a note. NBS velocity and layer volume
  # are multiplied before this check. 0 keeps every nonzero note eligible;
  # raise it on a busy server to avoid spending client channels on sounds that
  # are too quiet to hear. The parser still discards truly silent (zero-volume)
  # notes. Range 0.0-1.0.
  audible-floor: 0.0

  # Milliseconds spent ramping down when a song stops (0 = cut instantly).
  #
  # Notes struck during the ramp get progressively quieter, and once it ends
  # the notes still ringing are left to decay naturally instead of being cut
  # -- so the music tails off rather than stopping dead. The remaining tail
  # depends on the samples in the song. Press stop twice for an immediate cut.
  #
  # This also applies when SWITCHING songs: the outgoing song ramps down and
  # the new one starts as that ramp completes, with the old tail decaying
  # underneath it. Choosing yet another song mid-switch simply replaces what
  # plays next. Set 0 for the old behaviour, where a switch cuts instantly.
  # Max 5000.
  fade-out-ms: 500

  # Trim chords that would overflow the client's sound channels.
  #
  # Every note holds one channel for its full sample length, so a dense song
  # can exhaust the pool, at which point the client silently evicts arbitrary
  # sounds -- possibly the melody, or the game's own audio. This tracks how
  # many voices are actually still ringing, using each sample's MEASURED
  # length, and when a chord would genuinely push past voice-ceiling it drops
  # that chord's quietest notes instead. Sparse songs are never touched.
  # Set false to disable the trimming entirely.
  # Check a song with /nbw analyze to see its real demand.
  voice-allocation: true

  # How many sound channels the CLIENT has. 247 is vanilla Minecraft. Mods
  # that enlarge the audio engine's source pool raise this -- if your players
  # run one, set the real figure here and /nbw analyze will judge songs
  # against it instead of the vanilla number. Range 16-8192.
  client-channels: 247

  # How many of those channels this plugin will use at once. Kept below
  # client-channels so footsteps, mobs and ambience still have room; raise it
  # alongside client-channels on a modded setup. Clamped to client-channels.
  voice-ceiling: 200

  # Humanisation. NBS songs are perfectly quantised -- every note lands exactly
  # on its tick, and every note of a chord fires at the identical instant. That
  # simultaneity is most of what makes note block music sound mechanical.
  # This scatters each note slightly in time and in volume.
  #
  # This is independent of precision-ms: because the clock's phase drifts
  # against note times, the jitter stays smoothly distributed at any clock
  # interval, so there is no need to enlarge it when precision-ms is raised.
  #
  # It IS limited by tempo, though, and that is handled automatically: timing
  # jitter is capped at 15% of a song tick, so it never grows large enough to
  # shuffle notes past one another. Below ~25 t/s nothing is capped and you get
  # exactly the value set here; above it the jitter shrinks with the tick, and
  # by ~40 t/s it is too small to hear at all. Very fast songs therefore play
  # with effectively exact timing whether or not this is on, and mid-song tempo
  # changes are followed. Velocity humanisation below is unaffected.
  #
  # Set humanize: false for the exact, quantised timing that Note Block
  # Studio and every other NBS player produce.
  humanize: true
  # Base timing spread in milliseconds. Chord drift can reach twice this;
  # a positive scheduling offset is added, giving delays up to 3x the spread.
  humanize-timing-ms: 6
  # Random volume variation per note (0.04 = +/-4%)
  humanize-velocity: 0.04
  # How the timing offset evolves between chords:
  #   0.0 - each chord is offset independently (looser, more random)
  #   1.0 - the offset drifts smoothly chord to chord, like a performer
  #         keeping loose time (recommended; sounds intentional, not sloppy)
  humanize-drift: 0.7
  # Bass drum, snare and hat carry the beat. Jittering percussion as much as
  # the melody doesn't sound human, it sounds like a bad drummer -- so scale
  # their jitter down (0 = keep percussion perfectly tight).
  humanize-percussion-factor: 0.25

  # Attach each note to the listener instead of placing it in the world.
  #
  # false           - notes are placed at your position. Stereo panning works,
  #                   but a note keeps ringing WHERE IT WAS PLAYED, so moving
  #                   away from it changes its volume and direction. Fine if
  #                   listeners stand still; audible as fading/stuttering if
  #                   they walk, sprint or fly.
  # true (default)  - notes travel with you: constant volume however you move.
  #                   Minecraft cannot pan an attached sound, so stereo-panning
  #                   below is ignored.
  #
  # Hot-reloadable, so you can flip it mid-song with /nbw reload and compare.
  follow-player: true

  # Reproduce each note's stereo panning by emitting it slightly to the
  # listener's left/right. Minecraft has no pan parameter, so this is done
  # positionally. Requires follow-player: false, since an attached sound has
  # no world position to offset.
  stereo-panning: true
  # How far (in blocks) a fully-panned note is offset from the listener.
  # Larger values widen the stereo image but push sounds far enough away that
  # Minecraft's distance attenuation starts making them quieter. Ignored when
  # stereo-panning is false.
  pan-distance: 2.0
